<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="粉色主题的 2048 经典小游戏，纯前端实现，支持键盘与触屏操作。" />
  <title>2048 · 粉色版</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ec5f9d'/%3E%3Ctext x='50' y='68' font-size='42' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="header">
      <h1 class="title">2048<span class="title-heart">💗</span></h1>
      <div class="score-boxes">
        <div class="score-box">
          <span class="score-label">当前得分</span>
          <span class="score-value" id="score">0</span>
          <div class="score-fx-layer" id="score-fx"></div>
        </div>
        <div class="score-box">
          <span class="score-label">最高分</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <p class="intro">合并相同数字，冲击 <strong>2048</strong>！</p>
      <button class="btn" id="new-game" type="button">新游戏</button>
    </div>

    <div class="board" id="board">
      <div class="cell-layer" aria-hidden="true">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div class="tile-layer" id="tile-layer"></div>
      <div class="board-overlay" id="overlay">
        <h2 class="overlay-title" id="overlay-title">游戏结束</h2>
        <p class="overlay-text" id="overlay-text"></p>
        <div class="overlay-buttons" id="overlay-buttons"></div>
      </div>
    </div>

    <p class="howto">操作方式：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>，手机上滑动屏幕即可</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
